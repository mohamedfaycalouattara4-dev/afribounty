[project]
name = "afribounty-core-platform"
version = "0.1.0"
description = "Socle technique AfriBounty : Django, DRF, PostgreSQL, Redis, Celery et ASGI."
requires-python = ">=3.12,<3.14"

[tool.ruff]
line-length = 160
target-version = "py312"
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
